<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediGaMi · Clientes</title>
<link rel="icon" href="../../assets/img/logo-credigami.jpeg">
<link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
<div class="app-shell"></div>

<div class="modal-fondo" id="modal-cliente">
  <div class="modal">
    <div class="modal__cabeza">
      <h3>Nuevo cliente</h3>
      <button class="modal__cerrar" id="cerrar-modal-cliente">✕</button>
    </div>
    <form id="form-cliente">
      <div class="modal__cuerpo">
        <div class="campo">
          <label>Nombre completo</label>
          <input type="text" id="c-nombre" placeholder="Ej. María Fernanda López" required>
        </div>
        <div class="fila-campos">
          <div class="campo">
            <label>DNI / Identidad</label>
            <input type="text" id="c-dni" placeholder="0501-XXXX-XXXXX" required>
          </div>
          <div class="campo">
            <label>Teléfono</label>
            <input type="text" id="c-telefono" placeholder="9999-9999" required>
          </div>
        </div>
        <div class="fila-campos">
          <div class="campo">
            <label>Tipo de negocio</label>
            <select id="c-negocio">
              <option value="Venta de ropa">Venta de ropa</option>
              <option value="Pulpería / abarrotería">Pulpería / abarrotería</option>
              <option value="Comedor / venta de comida">Comedor / venta de comida</option>
              <option value="Taller mecánico">Taller mecánico</option>
              <option value="Repostería">Repostería</option>
              <option value="Salón de belleza">Salón de belleza</option>
              <option value="Ferretería">Ferretería</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="campo">
            <label>Dirección</label>
            <input type="text" id="c-direccion" placeholder="Barrio, colonia, ciudad">
          </div>
        </div>
        <div class="campo">
          <label>Referencia personal <span class="obs">(nombre y teléfono)</span></label>
          <input type="text" id="c-referencia" placeholder="Nombre — teléfono">
        </div>
      </div>
      <div class="modal__pie">
        <button type="button" class="btn btn-linea" id="cancelar-modal-cliente">Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btn-guardar-cliente">Guardar cliente</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase (necesario porque data.js ya no usa localStorage, usa Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
  if (!localStorage.getItem('cg_usuario')) {
    window.location.href = '../login/index.html';
  }

  const main = CG_LAYOUT.render('clientes', 'Clientes', 'Clientes');

  main.innerHTML = `
    <div class="tarjeta">
      <div class="tarjeta__encabezado">
        <div><h3>Directorio de clientes</h3><p id="conteo-clientes"></p></div>
        <div style="display:flex; gap:10px;">
          <div class="buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="buscar-cliente" placeholder="Buscar por nombre o DNI…">
          </div>
          <button class="btn btn-primario" id="abrir-modal-cliente">+ Nuevo cliente</button>
        </div>
      </div>
      <div class="tabla-envoltura">
        <table>
          <thead>
            <tr><th>Cliente</th><th>DNI</th><th>Teléfono</th><th>Tipo de negocio</th><th>Dirección</th><th>Registrado</th><th></th></tr>
          </thead>
          <tbody id="tabla-clientes"></tbody>
        </table>
      </div>
    </div>
  `;

  function pintarClientes(filtro){
    const clientes = CG_DATA.clientes.listar();
    const f = (filtro||'').toLowerCase();
    const filtrados = clientes.filter(c => c.nombre.toLowerCase().includes(f) || c.dni.includes(f));
    document.getElementById('conteo-clientes').textContent = clientes.length + ' clientes registrados';

    const cuerpo = document.getElementById('tabla-clientes');
    if (!filtrados.length){
      cuerpo.innerHTML = `<tr><td colspan="7"><div class="vacio"><strong>${clientes.length ? 'Sin resultados' : 'Todavía no hay clientes'}</strong>${clientes.length ? 'Intenta con otro nombre o DNI.' : 'Registra tu primer cliente con el botón "Nuevo cliente".'}</div></td></tr>`;
      return;
    }
    cuerpo.innerHTML = filtrados.map(c => `
      <tr>
        <td class="celda-fuerte">${c.nombre}</td>
        <td>${c.dni}</td>
        <td>${c.telefono}</td>
        <td><span class="badge badge-info">${c.tipoNegocio||'—'}</span></td>
        <td class="celda-suave">${c.direccion||'—'}</td>
        <td class="celda-suave">${c.creado}</td>
        <td style="text-align:right;">
          <a class="btn btn-sm btn-linea" href="../prestamos/index.html">Nuevo préstamo</a>
          <button class="btn btn-sm btn-peligro" data-eliminar="${c.id}">Eliminar</button>
        </td>
      </tr>`).join('');

    cuerpo.querySelectorAll('[data-eliminar]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('¿Eliminar este cliente del directorio?')){
          CG_DATA.clientes.eliminar(btn.dataset.eliminar)
            .then(() => CG_TOAST('Cliente eliminado', 'alerta'))
            .catch(() => CG_TOAST('No se pudo eliminar, revisa tu conexión', 'alerta'));
        }
      });
    });
  }

  pintarClientes('');

  window.addEventListener('cg:datos-actualizados', (e) => {
    if (e.detail.coleccion === 'clientes') {
      pintarClientes(document.getElementById('buscar-cliente').value);
    }
  });

  document.getElementById('buscar-cliente').addEventListener('input', e => pintarClientes(e.target.value));

  const modal = document.getElementById('modal-cliente');
  document.getElementById('abrir-modal-cliente').addEventListener('click', () => modal.classList.add('visible'));
  document.getElementById('cerrar-modal-cliente').addEventListener('click', () => modal.classList.remove('visible'));
  document.getElementById('cancelar-modal-cliente').addEventListener('click', () => modal.classList.remove('visible'));

  document.getElementById('form-cliente').addEventListener('submit', function(e){
    e.preventDefault();
    const boton = document.getElementById('btn-guardar-cliente');
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    CG_DATA.clientes.agregar({
      nombre: document.getElementById('c-nombre').value.trim(),
      dni: document.getElementById('c-dni').value.trim(),
      telefono: document.getElementById('c-telefono').value.trim(),
      tipoNegocio: document.getElementById('c-negocio').value,
      direccion: document.getElementById('c-direccion').value.trim(),
      referencia: document.getElementById('c-referencia').value.trim()
    }).then(() => {
      e.target.reset();
      modal.classList.remove('visible');
      CG_TOAST('Cliente guardado correctamente', 'exito');
    }).catch(() => {
      CG_TOAST('No se pudo guardar, revisa tu conexión', 'alerta');
    }).finally(() => {
      boton.disabled = false;
      boton.textContent = 'Guardar cliente';
    });
  });
</script>
</body>
</html>
